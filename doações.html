<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Adminidtrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="src/css/style.css" rel="stylesheet">
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar p-3">
            <a class="brand d-flex align-items-center gap-2 mb-4" href="#">
                <span class="brand-mark">S2</span>
                <span>Projeto</span>
            </a>
            <p class="menu-label">Menu Principal</p>
            <nav class="nav flex-column gap-1" aria-label="Navegação principal">
                <a class="nav-link active" href="/projeto-Plataforma-Web-extens-o-/index.html">Home

                </a>
                <a class="nav-link " href="/projeto-Plataforma-Web-extens-o-/doações.html">Doações</a>
            </nav>

        </aside>
        <main class="main-content" id="inicio">
            <header class="topbar d-flex justify-content-between align-items-center gap-3">
                <div>
                    <p class="eyebrow mb-1">Painel Adminidtrativo</p>
                    <h1 class="h4 mb-0">Doações Necessárias</h1>
                </div>
                <div class="d-flex align-items-center gap-3	">
                    <button class="icon-button" type="button">*</button>
                    <div class="user-profile d-flex align-items-center gap-2">
                        <span class="avatar">GL</span>
                        <div class="d-none d-sm-block">
                            <small>Administrador</small>
                            <strong>George Lucas</strong>
                        </div>

                    </div>

                </div>
            </header>
            <section class="content-area">
                <section class="panel mb-4">
                    <div class="panel-heading d-flex justify-content-between align-items-center gap-2">
                        <div>
                            <h2>Lista de Necessidades</h2>
                            <p>Pesquise e filtro os itens que podem ser doados</p>
                        </div>
                        <button class="btn btn" id="show-window">Informações da Janela</button>



                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="visually-hidden">Pesquisar</label>
                            <input class="form-control" placeholder="Pesquisar por item ou categoria" id="search" />
                        </div>
                        <div class="col-md-4">
                            <select class="form-select">
                                <option value="todas">todas</option>
                                <option value="urgente">urgente</option>
                                <option value="atencao">atencao</option>
                                <option value="normal">normal</option>
                            </select>
                        </div>

                    </div>
                    <div class="row gap-3 mb-4" id="donations-content"></div>
                    <div class="col-md-6 col-xl-4">
                        <article class="need-card">
                            <div class="d-flex justify-content-between"></div> </article>
                            </div>

                </section>

            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
